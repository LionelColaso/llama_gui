name: Pyright

# Pyright gate (reusable + manual). Triggered by ci.yml and auto_build.yml as
# reusable workflows; run directly only via workflow_dispatch.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Pyright
        run: uv run pyright -p pyproject.toml .
