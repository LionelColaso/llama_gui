name: Pytest

# Tests are their own gate workflow (reusable + manual +
# push/PR). Runs the unit + GUI suite headless (offscreen Qt); integration
# tests are skipped unless RUN_INTEGRATION=1.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Headless runners have no display server; pytest-qt needs the offscreen
    # Qt platform or it fails to create QApplication.
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Qt GUI tests need system GL libraries on headless Linux.
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglx-mesa0 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0
        shell: bash

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Tests (unit + gui, no integration)
        run: uv run pytest -m "not integration" -q
