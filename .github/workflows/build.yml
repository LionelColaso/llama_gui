name: Build

# Reusable build workflow is used by release and auto_build workflows, never inlined.
# Builds the standalone Nuitka executable on each OS via scripts/build.py (the distribute.py role),
# locates the artifact, smoke-tests it, and uploads a per-OS artifact.
on:
  workflow_call:
    inputs:
      attest:
        description: "Generate build attestations"
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      attest:
        description: "Generate build attestations"
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-nuitka
          max-size: 1.0G

      # Qt GUI smoke test needs system GL libraries on headless Linux.
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglx-mesa0 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0
        shell: bash

      - name: Sync dependencies (build group, no dev)
        run: uv sync --locked --no-dev --group build

      # scripts/build.py is the single build entrypoint:
      # it runs Nuitka --standalone, excludes type-checker/test tooling, and
      # produces the platform artifact (llamagui.dist/ or llama-gui.app).
      - name: Build
        run: uv run --no-dev --group build python scripts/build.py --product-version "0.0.0.0"
        env:
          CCACHE_MAXSIZE: "1.0G"

      # Locate the real built artifact on each OS "Find Executable"
      # pattern: find the binary recursively, derive the uploadable dir).
      - name: Find Executable
        id: find_executable
        shell: bash
        run: |
          exe=$(find build \( -name "llama-gui" -o -name "llama-gui.exe" \) -type f | head -n 1)
          if [ -z "$exe" ]; then
            echo "built executable not found under build/" >&2
            exit 1
          fi
          case "$exe" in
            *llama-gui.app/Contents/MacOS/llama-gui)
              artifact=$(dirname "$(dirname "$(dirname "$exe")")")
              ;;
            *)
              artifact=$(dirname "$exe")
              ;;
          esac
          echo "EXECUTABLE=$exe" >> "$GITHUB_OUTPUT"
          echo "ARTIFACT=$artifact" >> "$GITHUB_OUTPUT"
          echo "Executable: $exe"
          echo "Artifact:   $artifact"

      - name: Launch smoke test (built executable runs)
        shell: bash
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
            export QT_QPA_PLATFORM=offscreen
          fi
          EXE="${{ steps.find_executable.outputs.EXECUTABLE }}"
          # subprocess timeout (cross-platform); the shell `timeout` command is
          # unavailable on macOS runners.
          python - "$EXE" <<'PY'
          import subprocess, sys
          exe = sys.argv[1]
          try:
              subprocess.run([exe, "describe", "--json"], timeout=30, check=True)
          except subprocess.TimeoutExpired:
              print("smoke test timed out", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Generate build attestation
        uses: actions/attest-build-provenance@v4
        if: ${{ inputs.attest }}
        with:
          subject-path: ${{ steps.find_executable.outputs.ARTIFACT }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: llama-gui-${{ matrix.os }}
          path: ${{ steps.find_executable.outputs.ARTIFACT }}
          if-no-files-found: warn
