name: CI

# Pull-request gate. The push-to-main pipeline (gates + build + Edge release)
# lives in auto_build.yml so a push does not double-build. This workflow
# validates pull requests by running the project's canonical check suite.
on:
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Run check suite
        run: uv run python scripts/check.py

  build:
    needs: check
    permissions:
      id-token: write
      contents: read
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      attest: false
