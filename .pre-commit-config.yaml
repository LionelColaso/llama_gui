repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, PySide6, httpx, keyring]
        args: [--ignore-missing-imports]

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.398
    hooks:
      - id: pyright

  - repo: local
    hooks:
      - id: regenerate-mapping
        name: regenerate mapping.md
        entry: uv run python scripts/mapping.py
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
